<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Admin — Sweets by Dulce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --pink: #FF9EB5;
            --deep-pink: #FF6B9D;
            --choco: #4A3728;
            --dark-choco: #3D2914;
            --cream: #FFF9F5;
            --mint: #B8E6D8;
            --lavender: #E6E6FA;
            --gold: #D4AF37;
            --danger: #FF4757;
            --success: #2ed573;
            --card-bg: rgba(255,255,255,0.7);
            --shadow: 0 8px 32px rgba(74,55,40,0.13);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFF9F5 0%, #FFD1DC 50%, #E8D5E8 100%);
            min-height: 100vh;
            color: var(--choco);
        }

        /* ── LOGIN SCREEN ── */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .login-logo {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .login-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--choco);
            margin-bottom: 0.3rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--choco);
            opacity: 0.6;
            margin-bottom: 2rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pink);
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border: 2px solid rgba(255,158,181,0.4);
            border-radius: 14px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            background: rgba(255,255,255,0.8);
            color: var(--choco);
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--deep-pink);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--choco), var(--dark-choco));
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74,55,40,0.3);
        }

        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.8rem;
            display: none;
        }

        /* ── ADMIN PANEL ── */
        #adminPanel { display: none; }

        .admin-header {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(15px);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(74,55,40,0.1);
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--choco);
        }

        .admin-brand .emoji { font-size: 1.5rem; }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn-icon {
            background: rgba(255,158,181,0.2);
            border: none;
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            color: var(--choco);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-icon:hover { background: rgba(255,107,157,0.2); }

        .btn-icon.danger { background: rgba(255,71,87,0.1); color: var(--danger); }
        .btn-icon.danger:hover { background: rgba(255,71,87,0.2); }

        .admin-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.2rem 1rem 4rem;
        }

        /* ── STATS BAR ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-num {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--deep-pink);
        }

        .stat-label {
            font-size: 0.78rem;
            font-weight: 600;
            opacity: 0.7;
        }

        /* ── ADD PRODUCT FORM ── */
        .form-section {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .section-title-admin {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--choco);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--choco);
            opacity: 0.8;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 0.75rem 1rem;
            border: 2px solid rgba(255,158,181,0.3);
            border-radius: 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--choco);
            background: rgba(255,255,255,0.8);
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--deep-pink);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Image upload area */
        .image-upload-area {
            border: 2.5px dashed rgba(255,158,181,0.5);
            border-radius: 14px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.5);
            position: relative;
        }

        .image-upload-area:hover,
        .image-upload-area.dragover {
            border-color: var(--deep-pink);
            background: rgba(255,107,157,0.05);
        }

        .image-upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            border: none;
            padding: 0;
        }

        .upload-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin: 0.5rem auto 0;
            display: none;
        }

        .upload-text { font-size: 0.85rem; font-weight: 600; opacity: 0.6; }
        .upload-icon { font-size: 2rem; margin-bottom: 0.3rem; }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--deep-pink), #FF4081);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,107,157,0.4);
        }

        /* ── SEARCH & FILTER ── */
        .search-filter-row {
            display: flex;
            gap: 0.7rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .admin-search {
            flex: 1;
            min-width: 180px;
            padding: 0.7rem 1rem 0.7rem 2.6rem;
            border: 2px solid rgba(255,158,181,0.3);
            border-radius: 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--choco);
            background: rgba(255,255,255,0.8);
            outline: none;
            transition: border-color 0.3s;
            position: relative;
        }

        .admin-search:focus { border-color: var(--deep-pink); }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 180px;
        }

        .search-wrap i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pink);
            font-size: 0.9rem;
        }

        .admin-filter-select {
            padding: 0.7rem 1rem;
            border: 2px solid rgba(255,158,181,0.3);
            border-radius: 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--choco);
            background: rgba(255,255,255,0.8);
            outline: none;
            cursor: pointer;
        }

        /* ── PRODUCT LIST ── */
        .product-list-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--choco);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .product-list { display: flex; flex-direction: column; gap: 0.7rem; }

        .admin-product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 0.9rem 1rem;
            display: flex;
            gap: 0.9rem;
            align-items: center;
            box-shadow: 0 3px 12px rgba(74,55,40,0.08);
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .admin-product-card:hover { border-color: rgba(255,158,181,0.4); }

        .admin-product-card.custom-product {
            border-left: 4px solid var(--deep-pink);
        }

        .admin-product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
            background: var(--lavender);
        }

        .admin-product-info {
            flex: 1;
            min-width: 0;
        }

        .admin-product-name {
            font-family: 'Fredoka One', cursive;
            font-size: 0.95rem;
            color: var(--choco);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-product-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .meta-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            background: rgba(255,158,181,0.2);
            color: var(--choco);
        }

        .meta-badge.price {
            background: rgba(212,175,55,0.2);
            color: var(--dark-choco);
        }

        .meta-badge.custom {
            background: rgba(255,107,157,0.15);
            color: var(--deep-pink);
        }

        .admin-product-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btn.edit {
            background: rgba(184,230,216,0.5);
            color: #2E7D62;
        }

        .action-btn.edit:hover { background: var(--mint); }

        .action-btn.delete {
            background: rgba(255,71,87,0.1);
            color: var(--danger);
        }

        .action-btn.delete:hover { background: rgba(255,71,87,0.2); }

        /* ── EDIT MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74,55,40,0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .edit-modal {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(74,55,40,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .modal-header h3 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--choco);
        }

        .modal-close-btn {
            background: rgba(255,71,87,0.1);
            border: none;
            border-radius: 10px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: var(--danger);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--choco);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(74,55,40,0.3);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #2E7D62; }
        .toast.error { background: var(--danger); }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.5;
        }

        .empty-state .emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .empty-state p { font-weight: 600; }

        /* ── BACK BUTTON ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--choco);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            transition: all 0.2s;
        }

        .back-link:hover { background: rgba(255,255,255,0.9); }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.6);
            color: var(--choco);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 0.6rem;
            transition: all 0.2s;
        }

        .page-btn.active, .page-btn:hover {
            background: var(--choco);
            color: white;
        }

        .products-section {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════ -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">🎂</div>
        <h1 class="login-title">Admin Panel</h1>
        <p class="login-subtitle">Sweets by Dulce</p>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Password" onkeydown="if(event.key==='Enter') attemptLogin()">
        </div>
        <button class="btn-primary" onclick="attemptLogin()">
            <i class="fas fa-sign-in-alt"></i> Enter
        </button>
        <p class="login-error" id="loginError">❌ Incorrect password</p>
    </div>
</div>

<!-- ══════════════════════════════════════
     ADMIN PANEL
══════════════════════════════════════ -->
<div id="adminPanel">

    <!-- Header -->
    <header class="admin-header">
        <div class="admin-brand">
            <span class="emoji">🎂</span>
            <span>Admin</span>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-icon" target="_blank">
                <i class="fas fa-eye"></i>
                <span class="hide-xs">View Site</span>
            </a>
            <button class="btn-icon danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span class="hide-xs">Exit</span>
            </button>
        </div>
    </header>

    <div class="admin-body">

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-num" id="statTotal">—</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statCustom">—</div>
                <div class="stat-label">Added by You</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statCats">—</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <!-- Add / Edit Form -->
        <div class="form-section" id="formSection">
            <div class="section-title-admin">
                <i class="fas fa-plus-circle" style="color:var(--deep-pink)"></i>
                <span id="formTitle">Add New Product</span>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="fName" placeholder="e.g. Unicorn Cake" maxlength="80">
                </div>
                <div class="form-group">
                    <label>Starting Price ($)</label>
                    <input type="number" id="fPrice" placeholder="e.g. 45" min="0" step="0.01">
                </div>
                <div class="form-group full">
                    <label>Description *</label>
                    <textarea id="fDesc" placeholder="Describe the dessert, flavors, details..."></textarea>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="fCategory">
                        <option value="">— Select —</option>
                        <option value="cakes">🎂 Cakes</option>
                        <option value="cupcakes">🧁 Cupcakes</option>
                        <option value="specialty">✨ Specialty</option>
                        <option value="holiday">🎉 Special Dates</option>
                        <option value="pies">🥧 Pies & Tarts</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Badge</label>
                    <select id="fBadge">
                        <option value="">None</option>
                        <option value="best-seller">⭐ Best Seller</option>
                        <option value="limited">✨ Limited Edition</option>
                        <option value="new">🆕 New</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>Photo (or URL)</label>
                    <div class="image-upload-area" id="uploadArea"
                         ondragover="event.preventDefault(); this.classList.add('dragover')"
                         ondragleave="this.classList.remove('dragover')"
                         ondrop="handleDrop(event)">
                        <input type="file" id="fImageFile" accept="image/*" onchange="handleFileSelect(event)">
                        <div class="upload-icon" id="uploadIcon">📷</div>
                        <div class="upload-text" id="uploadText">Tap to select photo<br><small>or drag & drop</small></div>
                        <img id="uploadPreview" class="upload-preview" src="" alt="Preview">
                    </div>
                    <input type="text" id="fImageUrl" placeholder="Or paste image URL here" style="margin-top:0.5rem"
                           oninput="syncUrlPreview(this.value)">
                </div>
            </div>

            <input type="hidden" id="fEditId">
            <button class="btn-submit" id="submitBtn" onclick="saveProduct()">
                <i class="fas fa-save"></i> <span id="submitLabel">Save Product</span>
            </button>
            <button class="btn-icon" id="cancelEditBtn" onclick="cancelEdit()" style="margin-top:0.5rem;width:100%;display:none;justify-content:center;">
                <i class="fas fa-times"></i> Cancel Edit
            </button>
        </div>

        <!-- Products List -->
        <div class="products-section">
            <div class="product-list-title">
                <i class="fas fa-list" style="color:var(--deep-pink)"></i>
                Full Catalog
            </div>

            <div class="search-filter-row">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" class="admin-search" id="adminSearch"
                           placeholder="Search..." oninput="renderAdminList()">
                </div>
                <select class="admin-filter-select" id="adminCategoryFilter" onchange="renderAdminList()">
                    <option value="">All categories</option>
                    <option value="cakes">Cakes</option>
                    <option value="cupcakes">Cupcakes</option>
                    <option value="specialty">Specialty</option>
                    <option value="holiday">Special Dates</option>
                    <option value="pies">Pies & Tarts</option>
                </select>
                <select class="admin-filter-select" id="adminSourceFilter" onchange="renderAdminList()">
                    <option value="">All products</option>
                    <option value="custom">Added by me</option>
                    <option value="base">Original catalog</option>
                </select>
            </div>

// ── STATE ──
let customProducts = [];
let currentPage = 1;
let editingProduct = null;
let uploadedImageData = null; // base64

function getCustomProducts() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
}

function saveCustomProducts(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function getMergedCatalog() {
    const custom = getCustomProducts();
    const result = [...baseCatalog];
    custom.forEach(cp => {
        const idx = result.findIndex(p => p.id === cp.id);
        if (idx >= 0) {
            result[idx] = { ...result[idx], ...cp, _overridden: true };
        } else {
            result.push({ ...cp, _custom: true });
        }
    });
    return result;
}

// ── INIT ──
function initAdmin() {
    updateStats();
    renderAdminList();
}

function updateStats() {
    const merged = getMergedCatalog();
    const custom = getCustomProducts();
    const cats = new Set(merged.map(p => p.category)).size;
    document.getElementById('statTotal').textContent = merged.length;
    document.getElementById('statCustom').textContent = custom.length;
    document.getElementById('statCats').textContent = cats;
}

// ── RENDER PRODUCT LIST ──
function renderAdminList() {
    const search = document.getElementById('adminSearch').value.toLowerCase().trim();
    const catFilter = document.getElementById('adminCategoryFilter').value;
    const srcFilter = document.getElementById('adminSourceFilter').value;

    let products = getMergedCatalog();
    const customIds = new Set(getCustomProducts().map(p => p.id));

    if (search) products = products.filter(p =>
        p.title.toLowerCase().includes(search) ||
        (p.description||'').toLowerCase().includes(search)
    );
    if (catFilter) products = products.filter(p => p.category === catFilter);
    if (srcFilter === 'custom') products = products.filter(p => customIds.has(p.id));
    if (srcFilter === 'base') products = products.filter(p => !customIds.has(p.id));

    const total = products.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = 1;

    const paged = products.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    const list = document.getElementById('adminProductList');
    if (paged.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>No products found</p></div>';
    } else {
        list.innerHTML = paged.map(p => renderProductCard(p, customIds.has(p.id))).join('');
    }

    renderPagination(totalPages);
}

function renderProductCard(p, isCustom) {
    const fallback = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🧁</text></svg>";
    return `
    <div class="admin-product-card ${isCustom ? 'custom-product' : ''}">
        <img class="admin-product-img"
             src="${p.image||fallback}"
             onerror="this.src='${fallback}'"
             alt="${escHtml(p.title)}">
        <div class="admin-product-info">
            <div class="admin-product-name">${escHtml(p.title)}</div>
            <div class="admin-product-meta">
                <span class="meta-badge">${escHtml(CAT_LABELS[p.category]||p.category)}</span>
                ${p.price ? `<span class="meta-badge price">$${p.price}</span>` : ''}
                ${isCustom ? '<span class="meta-badge custom">✏️ Edited</span>' : ''}
            </div>
        </div>
        <div class="admin-product-actions">
            <button class="action-btn edit" title="Edit" onclick="openEditModal(${p.id})">
                <i class="fas fa-pen"></i>
            </button>
            ${isCustom ? `<button class="action-btn delete" title="Delete / Restore" onclick="deleteProduct(${p.id})">
                <i class="fas fa-trash"></i>
            </button>` : ''}
        </div>
    </div>`;
}

function renderPagination(total) {
    const pg = document.getElementById('pagination');
    if (total <= 1) { pg.innerHTML = ''; return; }
    let html = '';
    if (currentPage > 1) html += `<button class="page-btn" onclick="goPage(${currentPage-1})">‹</button>`;
    for (let i = 1; i <= total; i++) {
        if (i === currentPage || i === 1 || i === total || Math.abs(i-currentPage) <= 1) {
            html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
        } else if (Math.abs(i-currentPage) === 2) {
            html += `<span style="padding:0 4px;align-self:center">…</span>`;
        }
    }
    if (currentPage < total) html += `<button class="page-btn" onclick="goPage(${currentPage+1})">›</button>`;
    pg.innerHTML = html;
}

function goPage(n) { currentPage = n; renderAdminList(); window.scrollTo(0,0); }

// ── SAVE PRODUCT ──
function saveProduct() {
    const name = document.getElementById('fName').value.trim();
    const desc = document.getElementById('fDesc').value.trim();
    const cat = document.getElementById('fCategory').value;
    const price = document.getElementById('fPrice').value.trim();
    const badge = document.getElementById('fBadge').value;
    const imgUrl = document.getElementById('fImageUrl').value.trim();

    if (!name) { showToast('Enter a product name', 'error'); return; }
    if (!cat) { showToast('Select a category', 'error'); return; }

    const customs = getCustomProducts();

    // Determine image
    let img = uploadedImageData || imgUrl || IMAGE_PATH + 'placeholder.jpg';

    const newProduct = {
        id: Date.now(),
        title: name,
        description: desc,
        category: cat,
        categoryLabel: CAT_LABELS[cat] || cat,
        price: price ? parseFloat(price) : null,
        badge: badge || null,
        image: img,
        _custom: true
    };

    customs.push(newProduct);
    saveCustomProducts(customs);

    // Reset form
    document.getElementById('fName').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fCategory').value = '';
    document.getElementById('fPrice').value = '';
    document.getElementById('fBadge').value = '';
    document.getElementById('fImageUrl').value = '';
    document.getElementById('fImageFile').value = '';
    document.getElementById('uploadPreview').style.display = 'none';
    document.getElementById('uploadIcon').style.display = 'block';
    document.getElementById('uploadText').style.display = 'block';
    uploadedImageData = null;

    updateStats();
    renderAdminList();
    showToast('✅ Product added!', 'success');
}

// ── EDIT MODAL ──
function openEditModal(id) {
    const all = getMergedCatalog();
    const p = all.find(x => x.id === id);
    if (!p) return;

    editingProduct = p;
    document.getElementById('mName').value = p.title || '';
    document.getElementById('mDesc').value = p.description || '';
    document.getElementById('mCategory').value = p.category || 'cakes';
    document.getElementById('mPrice').value = p.price || '';
    document.getElementById('mBadge').value = p.badge || '';
    document.getElementById('mImageUrl').value = p.image || '';

    document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    editingProduct = null;
}

function saveEditModal() {
    if (!editingProduct) return;

    const name = document.getElementById('mName').value.trim();
    const desc = document.getElementById('mDesc').value.trim();
    const cat = document.getElementById('mCategory').value;
    const price = document.getElementById('mPrice').value.trim();
    const badge = document.getElementById('mBadge').value;
    const img = document.getElementById('mImageUrl').value.trim();

    if (!name) { showToast('Enter a name', 'error'); return; }

    const customs = getCustomProducts();
    const idx = customs.findIndex(p => p.id === editingProduct.id);

    const updated = {
        ...editingProduct,
        title: name,
        description: desc,
        category: cat,
        categoryLabel: CAT_LABELS[cat] || cat,
        price: price ? parseFloat(price) : null,
        badge: badge || null,
        image: img || editingProduct.image,
    };

    if (idx >= 0) {
        customs[idx] = updated;
    } else {
        customs.push(updated);
    }

    saveCustomProducts(customs);
    updateStats();
    renderAdminList();
    closeEditModal();
    showToast('✅ Product updated!', 'success');
}

// ── DELETE ──
function deleteProduct(id) {
    if (!confirm('Delete this product? If it was in the original catalog, it will be restored.')) return;
    const customs = getCustomProducts().filter(p => p.id !== id);
    saveCustomProducts(customs);
    updateStats();
    renderAdminList();
    showToast('🗑️ Product removed', 'success');
}

// ── FILE UPLOAD ──
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    loadImageFile(file);
}

function handleDrop(event) {
    event.preventDefault();
    document.getElementById('uploadArea').classList.remove('dragover');
    const file = event.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file);
}

function loadImageFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        uploadedImageData = e.target.result;
        const preview = document.getElementById('uploadPreview');
        preview.src = uploadedImageData;
        preview.style.display = 'block';
        document.getElementById('uploadIcon').style.display = 'none';
        document.getElementById('uploadText').textContent = file.name;
        document.getElementById('fImageUrl').value = '';
    };
    reader.readAsDataURL(file);
}

function syncUrlPreview(url) {
    if (url) {
        uploadedImageData = null;
        const preview = document.getElementById('uploadPreview');
        preview.src = url;
        preview.style.display = 'block';
        document.getElementById('uploadIcon').style.display = 'none';
        document.getElementById('uploadText').textContent = 'URL set';
        document.getElementById('fImageFile').value = '';
    }
}

// ── CANCEL EDIT ──
function cancelEdit() {
    document.getElementById('fEditId').value = '';
    document.getElementById('formTitle').textContent = 'Add New Product';
    document.getElementById('submitLabel').textContent = 'Save Product';
    document.getElementById('cancelEditBtn').style.display = 'none';
}

// ── TOAST ──
function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

// ── UTILS ──
function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
});

// Init if already logged in
if (sessionStorage.getItem('sbd_admin') === '1') {
    document.addEventListener('DOMContentLoaded', initAdmin);
    // if already past DOMContentLoaded
    if (document.readyState !== 'loading') initAdmin();
}
</script>
